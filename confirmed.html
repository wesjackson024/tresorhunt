<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're In — Tresor Hunt</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .confirmed-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      text-align: center;
    }

    .confirmed-card {
      background: #1a1a2e;
      border: 1px solid rgba(255, 217, 61, 0.2);
      border-radius: 20px;
      padding: 56px 48px;
      max-width: 520px;
      width: 100%;
    }

    .confirmed-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      display: block;
    }

    .confirmed-card h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem;
      color: #FFD93D;
      letter-spacing: 3px;
      margin: 0 0 16px;
    }

    .confirmed-card p {
      color: rgba(232, 232, 240, 0.7);
      font-size: 1rem;
      line-height: 1.7;
      margin: 0 0 40px;
    }

    .follow-label {
      font-family: 'Nunito', sans-serif;
      font-size: 0.7rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: rgba(255, 217, 61, 0.5);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-icons a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border-radius: 14px;
      background: rgba(255, 217, 61, 0.07);
      border: 1px solid rgba(255, 217, 61, 0.2);
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .social-icons a:hover {
      background: rgba(255, 217, 61, 0.15);
      border-color: rgba(255, 217, 61, 0.5);
      transform: translateY(-2px);
    }

    .social-icons svg {
      width: 22px;
      height: 22px;
      fill: #FFD93D;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: rgba(255, 217, 61, 0.2);
      margin: 0 auto 32px;
    }

    .back-link {
      display: inline-block;
      margin-top: 36px;
      font-size: 0.8rem;
      color: rgba(232, 232, 240, 0.3);
      text-decoration: none;
      letter-spacing: 1px;
    }

    .back-link:hover {
      color: rgba(255, 217, 61, 0.6);
    }
  </style>
</head>

          <path d="M29 52 Q29 40 45 40 Q61 40 61 52" fill="#FF6B6B" stroke="#FFD93D" stroke-width="1.5"/>
          <rect x="40" y="54" width="10" height="8" rx="2" fill="#1a1a2e" stroke="#FFD93D" stroke-width="1"/>
          <circle cx="45" cy="58" r="2" fill="#FFD93D"/>
          <circle cx="45" cy="45" r="3" fill="#FFD93D"/>

      <span class="logo-text">TRESOR<span>HUNT</span></span>
